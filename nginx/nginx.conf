# Run nginx worker processes automatically based on CPU cores
worker_processes auto;

# Error log location and level
error_log /var/log/nginx/error.log warn;

# Process ID file
pid /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {
    # Include MIME types for proper content-type headers
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression for faster responses
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Load all site configs from conf.d/
    include /etc/nginx/conf.d/*.conf;
}
